name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check --prefix frontend
      - run: npm test --prefix frontend
  backend-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m compileall -q student_crm scripts
      - run: python scripts/check_package.py
      - run: python -m pip install 'cryptography>=46,<51'
      - run: python -m unittest discover -s scripts -p test_site_transfer.py
